# Local checks, run on every commit. There is no CI: everything here runs in
# well under a second, so it is cheap to make the commit itself the gate.
#
#   brew install pre-commit    (or: pip install pre-commit)
#   pre-commit install
#   pre-commit run --all-files
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
        # Home Assistant blueprints use the `!input` tag, which a plain YAML
        # parser cannot resolve. `tests/test_blueprints.py` loads them with a
        # constructor for it and checks a good deal more besides.
        exclude: ^blueprints/
      - id: end-of-file-fixer
      - id: trailing-whitespace
        # Fixture payloads are byte-preserved captures from the grill; the
        # firmware's own whitespace is the point of them.
        exclude: ^tests/fixtures/
      - id: check-added-large-files
        args: [--maxkb=256]
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: no-secrets
        name: no device identifiers or tokens
        entry: python3 scripts/check_no_secrets.py
        language: system
        types: [text]

      - id: translations-in-sync
        name: translation files define the same keys
        entry: python3 scripts/check_translations.py
        language: system
        pass_filenames: false
        files: ^custom_components/ninja_woodfire/translations/

      - id: compileall
        name: integration compiles
        entry: python3 -m compileall -q custom_components/ninja_woodfire
        language: system
        pass_filenames: false
        files: ^custom_components/.*\.py$

      # `language: python` so pre-commit builds and caches its own environment.
      # Home Assistant is never imported — everything under _lib/ is
      # deliberately free of it, and the coordinator tests stub the four
      # symbols it does use — so this works on a clean checkout with no local
      # venv setup. Keep in step with requirements-test.txt.
      - id: pytest
        name: pytest
        entry: pytest -q
        language: python
        additional_dependencies: [pytest>=8.0, aiohttp>=3.9, pyyaml>=6.0, jinja2>=3.1]
        pass_filenames: false
        files: ^(custom_components|tests|blueprints)/
