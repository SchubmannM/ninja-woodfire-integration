blueprint:
  name: "Ninja Woodfire: food is ready"
  description: >
    One notification when a cook ends — and only one.


    The grill announces the end twice. It raises `7:getfood` about ten seconds
    after `6:done`, while it is still nominally cooking; then the integration
    fires `cook_done` when the grill state finally goes idle, which is however
    long the food sits before you shut it — 2m16s in one observed cook.


    Neither signal is reliable on its own. One captured grill cook ended with
    no `getfood` at all, so that alone would have said nothing; and `cook_done`
    is always the late one. So both trigger here, and `mode: single` lets
    whichever arrives first be the only one that speaks.


    This is a separate blueprint from "cook notifications" for exactly that
    reason: `mode: single` is what suppresses the duplicate, and applying it to
    an automation carrying every other notification would swallow those too.


    For preheat / add the food / turn the food, see the companion
    "Ninja Woodfire: cook notifications" blueprint.
  domain: automation
  source_url: https://github.com/SchubmannM/ninja-woodfire-integration/blob/main/blueprints/automation/ninja_woodfire/cook_finished.yaml
  author: SchubmannM
  input:
    grill:
      name: Grill
      description: >
        Which grill to watch. Only matters if you have two, but the automation
        has to name one.
      selector:
        device:
          filter:
            - integration: ninja_woodfire
    grill_state:
      name: Grill state sensor
      description: >
        The grill's "Grill state" sensor, belonging to the grill above. Used to
        release the hold below when a new cook starts — nothing triggers on it.
      selector:
        entity:
          filter:
            - integration: ninja_woodfire
              domain: sensor
    prompt_sensor:
      name: Prompt sensor
      description: >
        The grill's "Prompt" sensor, which carries what the appliance itself is
        asking for. This is the earlier of the two end-of-cook signals. Leave it
        empty and you still get the notification, just later — off the cook_done
        event instead.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - integration: ninja_woodfire
              domain: sensor
    notify_action:
      name: How to notify
      description: >
        Runs once per cook, with `{{ title }}` and `{{ message }}` already
        written for you.
      default:
        - action: notify.notify
          data:
            title: "{{ title }}"
            message: "{{ message }}"
      selector:
        action: {}

# The whole mechanism. A second trigger arriving while this run holds the lock
# is discarded rather than queued, which is what turns two signals into one
# notification. `silent` because that discard is the intended behaviour, not a
# condition worth logging every cook.
mode: single
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input prompt_sensor
    to: "getfood"
    id: getfood
  - trigger: event
    event_type: ninja_woodfire_cook_done
    id: cook_done

variables:
  grill: !input grill

conditions:
  # Every grill fires the event, so ignore the other one's. The prompt trigger
  # is already tied to one grill by the entity picked above, and carries no
  # `trigger.event` to test.
  - condition: template
    value_template: >-
      {{ trigger.event is not defined
         or trigger.event.data.device_id == grill }}

actions:
  - variables:
      grill_name: >-
        {%- set named = trigger.event.data.device_name if trigger.event is defined
                        else device_attr(trigger.entity_id, 'name_by_user')
                             or device_attr(trigger.entity_id, 'name') -%}
        {{- named or 'The grill' -}}
      # Only `cook_done` knows the difference. `getfood` is never raised for a
      # cook somebody stopped early.
      stopped: >-
        {{- trigger.id == 'cook_done'
            and trigger.event.data.reason != 'done' -}}
      title: >-
        {%- if stopped -%}
          {{ grill_name }} — cook stopped
        {%- else -%}
          {{ grill_name }} — food is ready
        {%- endif -%}
      message: >-
        {%- if stopped -%}
          The cook was stopped before it finished.
        {%- else -%}
          The cook has finished — go and get your food.
        {%- endif -%}
  - alias: Send it
    choose: []
    default: !input notify_action
  # Hold the lock so the partner signal is swallowed — but release it the
  # moment a new cook begins, so that cook can announce its own ending. A plain
  # delay would suppress the next cook's notification instead: two cooks thirty
  # seconds apart were observed, the second only three minutes long.
  - alias: Hold until the next cook, or give up
    wait_for_trigger:
      - trigger: state
        entity_id: !input grill_state
        to: "cooking"
    timeout:
      minutes: 15
    continue_on_timeout: true
